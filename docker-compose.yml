services:
  db:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flower_shop
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql

  api:
    build: ./server
    ports:
      - "3000:80"
    environment:
      DB_HOST: db
      DB_NAME: flower_shop
      DB_USER: root
      DB_PASS: root
    volumes:
      - ./server:/var/www/html
    depends_on:
      - db

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://api:80
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    depends_on:
      - api

volumes:
  db_data: